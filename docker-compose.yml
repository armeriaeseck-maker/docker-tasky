services:
  web:
    build: ./frontend
    ports:
      - "3000:3000"

  api:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DB_URL: mongodb://database/tasky
    volumes:
      - ./backend:/app

  database:
    image: mongo:4.0-xenial
    ports:
      - "27017:27017"
    volumes:
      - tasky:/data/db

volumes:
  tasky:
